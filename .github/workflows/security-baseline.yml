name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    uses: MartyFox/central-dashboard/.github/workflows/security-baseline.yml@2b5cb14a5969f9c82ad17c917c7f9db5d8a36dc4
    with:
      mode: report
      scanners: vuln,secret,misconfig
      detection-priority: comprehensive
      include-dev-deps: true
      runner: ${{ vars.SECURITY_RUNNER || '["ubuntu-24.04"]' }}
      results-storage: ${{ vars.SECURITY_RESULTS_STORAGE || 'branch' }}
      cache-db: ${{ vars.SECURITY_CACHE_DB == 'true' }}

  codeql:
    needs: security-baseline
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: write
    uses: MartyFox/central-dashboard/.github/workflows/codeql.yml@81c0eca8ec4e7b902a85f54288bcf33b204f0d49
    with:
      languages: '["go"]'
      runner: ${{ vars.SECURITY_RUNNER || '["ubuntu-24.04"]' }}

  publish:
    needs: [security-baseline, codeql]
    if: >-
      always() && (vars.SECURITY_RESULTS_STORAGE || 'branch') == 'branch' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    uses: MartyFox/central-dashboard/.github/workflows/publish-results.yml@22aa90e3d52c5657cb2db2ca8e3e2d41a99a2c83
    with:
      runner: ${{ vars.SECURITY_RUNNER || '["ubuntu-24.04"]' }}
      summary: ${{ needs.security-baseline.outputs.summary }}
      scan-result: ${{ needs.security-baseline.result }}
      results-branch: ${{ vars.SECURITY_RESULTS_BRANCH || 'security-results' }}
      results-path: ${{ vars.SECURITY_RESULTS_PATH || 'security-summary.json' }}
